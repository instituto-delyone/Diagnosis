<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnosis Engine | IDMT Pró</title>
    <style>
        :root {
            --idmt-navy: #071426;
            --idmt-blue: #1f5fae;
            --idmt-green: #238b57;
            --idmt-bg: #f7f9fc;
            --idmt-ink: #1f2933;
        }

        body {
            background-color: var(--idmt-navy);
            color: var(--idmt-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .engine-container {
            width: 100%;
            max-width: 900px;
            background-color: var(--idmt-bg);
            color: var(--idmt-ink);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 95vh;
        }

        .header {
            background-color: var(--idmt-navy);
            color: white;
            padding: 15px;
            text-align: center;
            border-bottom: 3px solid var(--idmt-blue);
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
        }

        .vitals-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background-color: #cbd5e1;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 0.8rem;
            gap: 4px;
            color: var(--idmt-navy);
            border-bottom: 1px solid #94a3b8;
        }

        .vital-item {
            background: white;
            padding: 4px;
            border-radius: 4px;
        }

        .dashboard {
            display: flex;
            justify-content: space-between;
            background-color: #e2e8f0;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .status-bar {
            flex-grow: 1;
            margin: 0 10px;
            background-color: #ccc;
            border-radius: 10px;
            overflow: hidden;
            height: 12px;
        }

        .status-fill {
            height: 100%;
            background-color: var(--idmt-green);
            width: 85%;
            transition: width 0.3s ease, background-color 0.3s;
        }

        .clinical-area {
            flex-grow: 1;
            padding: 20px;
            font-family: "Georgia", serif;
            font-size: 1rem;
            line-height: 1.5;
            overflow-y: auto;
            background-color: #ffffff;
            border-bottom: 1px solid #cbd5e1;
        }

        .mensagem { margin-bottom: 15px; white-space: pre-wrap; }
        .paciente { color: #b91c1c; font-weight: bold; }
        .preceptor { color: var(--idmt-blue); font-style: italic; }
        .user { color: var(--idmt-ink); font-weight: bold; background: #f1f5f9; padding: 8px; border-radius: 6px; border-left: 3px solid var(--idmt-blue); }

        .controls {
            padding: 15px;
            background-color: #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-action { background-color: var(--idmt-blue); color: white; padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        @media (max-width: 600px) {
            .action-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        button {
            padding: 10px 6px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
        }

        .btn-help { background-color: #f59e0b; color: white; }
        .btn-science { background-color: var(--idmt-navy); color: white; }
        .btn-next { background-color: var(--idmt-green); color: white; }
        .btn-back { background-color: #64748b; color: white; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="engine-container">
    <div class="header">
        <h1>DIAGNOSIS ENGINE | IDMT PRÓ</h1>
    </div>

    <div class="vitals-bar">
        <div class="vital-item">FC: <span id="val-fc">110</span> bpm</div>
        <div class="vital-item">SpO2: <span id="val-spo2">93</span>%</div>
        <div class="vital-item">PA: <span id="val-pa">98/60</span></div>
        <div class="vital-item">GLI: <span id="val-gli">110</span> mg/dL</div>
    </div>

    <div class="dashboard">
        <span>Pts: <span id="score-display">0</span></span>
        <div class="status-bar">
            <div id="health-bar" class="status-fill"></div>
        </div>
        <span>Estabilidade: <span id="health-display">85</span>%</span>
    </div>

    <div class="clinical-area" id="clinical-log"></div>

    <div class="controls">
        <div class="input-row">
            <input type="text" id="user-input" placeholder="Digite sua conduta (ex: o2, eletro, AAS)..." onkeypress="if(event.key === 'Enter') processarAcao()">
            <button class="btn-action" onclick="processarAcao()">Agir</button>
        </div>
        <div class="action-buttons">
            <button class="btn-help" onclick="pedirAjuda()">💡 Dica</button>
            <button class="btn-science" onclick="scientificBoost()">🔬 PubMed</button>
            <button class="btn-next" onclick="proximoCaso()">Próximo ➡</button>
            <button class="btn-back" onclick="window.location.href='index.html'">⬅ Voltar</button>
        </div>
    </div>
</div>

<script src="Js/engine.js"></script>

<script>
    let pontuacao = 0;
    let estabilidade = 85; 
    let turnos = 0;
    let casoAtual = null;
    let faseAtual = 1;

    const clinicalLog = document.getElementById('clinical-log');
    const userInput = document.getElementById('user-input');
    const healthBar = document.getElementById('health-bar');
    const healthDisplay = document.getElementById('health-display');
    const scoreDisplay = document.getElementById('score-display');
    
    const valFc = document.getElementById('val-fc');
    const valSpo2 = document.getElementById('val-spo2');
    const valPa = document.getElementById('val-pa');

    // Array corrigida sem as chaves perdidas
    const arquivosPorSala = {
        vermelha: ['knowledge_base/endocrinologia.json', 'knowledge_base/cardiopatias.json'],
        clinica: ['knowledge_base/endocrinologia.json', 'knowledge_base/cardiopatias.json']
    };

    const urlParams = new URLSearchParams(window.location.search);
    const salaEscolhida = urlParams.get('sala') || 'clinica';

    window.onload = () => {
        carregarNovoCaso();
    };

    async function carregarNovoCaso() {
        clinicalLog.innerHTML = '';
        adicionarMensagem("preceptor", "🔄 Conectando ao repositório de casos...");

        try {
            const listaArquivos = arquivosPorSala[salaEscolhida];
            const arquivoSorteado = listaArquivos[Math.floor(Math.random() * listaArquivos.length)];
            
            // Rota corrigida para evitar a duplicação da pasta
            const response = await fetch(`./${arquivoSorteado}`); 
            if (!response.ok) throw new Error(`Arquivo não encontrado (${response.status})`);
            
            const casosDoArquivo = await response.json();
            const casoSorteado = casosDoArquivo[Math.floor(Math.random() * casosDoArquivo.length)];
            
            iniciarCaso(casoSorteado);

        } catch (error) {
            adicionarMensagem("preceptor", "❌ Erro ao carregar os casos da pasta knowledge_base.");
            adicionarMensagem("preceptor", `🔍 Detalhe técnico: ${error.message}`);
            console.error(error);
        }
    }

    function iniciarCaso(caso) {
        casoAtual = caso;
        estabilidade = 85;
        pontuacao = 0;
        turnos = 0;
        faseAtual = 1; 
        clinicalLog.innerHTML = '';
        
        adicionarMensagem("preceptor", `Iniciando caso (Dificuldade: ${casoAtual.dificuldade}). Fase de Investigação. O que você solicita?`);
        adicionarMensagem("paciente", `Admissão: ${casoAtual.vinheta_admissao}`);
        atualizarDashboard();
    }

    function proximoCaso() {
        carregarNovoCaso();
    }

    function processarAcao() {
        const inputAluno = userInput.value.trim();
        if (!inputAluno || !casoAtual) return;

        turnos++;
        adicionarMensagem("user", "Conduta: " + inputAluno);

        if (faseAtual === 1) {
            const validacao = idmtEngine.validarResposta(inputAluno, casoAtual.fase_1_investigacao.gabarito_esperado);
            
            if (validacao.valido) {
                adicionarMensagem("preceptor", "✅ " + casoAtual.fase_1_investigacao.achado_sucesso);
                faseAtual = 2;
                estabilidade = Math.min(100, estabilidade + 10);
                pontuacao += 30;
                adicionarMensagem("preceptor", "Com base nesses achados, qual é o seu diagnóstico?");
            } else {
                adicionarMensagem("preceptor", "❌ " + casoAtual.fase_1_investigacao.resposta_preceptor_erro);
                estabilidade -= 10;
                pontuacao -= 5;
            }
        } 
        else if (faseAtual === 2) {
            const validacao = idmtEngine.validarResposta(inputAluno, casoAtual.fase_2_diagnostico.gabarito_esperado);
            let distratorValido = false;
            
            if (casoAtual.fase_2_diagnostico.distrator_comum) {
                const distrator = idmtEngine.validarResposta(inputAluno, casoAtual.fase_2_diagnostico.distrator_comum);
                if (distrator && distrator.valido) distratorValido = true;
            }

            if (validacao.valido) {
                adicionarMensagem("preceptor", "✅ " + casoAtual.fase_2_diagnostico.achado_sucesso);
                faseAtual = 3;
                estabilidade = Math.min(100, estabilidade + 15);
                pontuacao += 30;
                adicionarMensagem("preceptor", "Diagnóstico confirmado. Qual a sua conduta terapêutica definitiva?");
            } else if (distratorValido) {
                adicionarMensagem("preceptor", "⚠️ " + casoAtual.fase_2_diagnostico.feedback_distrator);
                estabilidade -= 15;
                pontuacao -= 10;
            } else {
                adicionarMensagem("preceptor", "❌ Hipótese incorreta. Avalie novamente os exames da fase anterior.");
                estabilidade -= 10;
            }
        } 
        else if (faseAtual === 3) {
            const isRedFlag = idmtEngine.verificarRedFlag(inputAluno, casoAtual.fase_3_conduta.red_flag_mortal);
            const validacao = idmtEngine.validarResposta(inputAluno, casoAtual.fase_3_conduta.gabarito_esperado);

            if (isRedFlag) {
                adicionarMensagem("preceptor", "🚨 " + casoAtual.fase_3_conduta.feedback_red_flag);
                estabilidade = 0; 
                pontuacao -= 50;
            } else if (validacao.valido) {
                adicionarMensagem("preceptor", "✅ " + casoAtual.fase_3_conduta.feedback_sucesso);
                estabilidade = 100;
                pontuacao += 40;
                
                setTimeout(() => {
                    adicionarMensagem("preceptor", `🎓 DISCUSSÃO FINAL:\n\nTakeaway: ${casoAtual.discussao_clinica_final.takeaway_message}\n\nFisiopatologia: ${casoAtual.discussao_clinica_final.fisiopatologia}`);
                }, 1000);
                
                faseAtual = 4;
            } else {
                adicionarMensagem("preceptor", "❌ Conduta insuficiente ou errada. Qual é o tratamento principal exigido agora?");
                estabilidade -= 15;
            }
        }
        else if (faseAtual === 4) {
            adicionarMensagem("preceptor", "O caso já foi concluído. Clique em 'Próximo ➡' para um novo paciente.");
        }

        atualizarDashboard();
        userInput.value = '';
        clinicalLog.scrollTop = clinicalLog.scrollHeight;
    }

    function atualizarDashboard() {
        if (estabilidade <= 0) estabilidade = 0;
        healthDisplay.innerText = estabilidade;
        healthBar.style.width = estabilidade + '%';
        scoreDisplay.innerText = Math.max(0, Math.floor(pontuacao));

        if (estabilidade < 50) {
            valFc.innerText = "140";
            valSpo2.innerText = "85";
            valPa.innerText = "70/40";
            healthBar.style.backgroundColor = '#dc2626';
        } else {
            valFc.innerText = "110";
            valSpo2.innerText = "93";
            valPa.innerText = "98/60";
            healthBar.style.backgroundColor = estabilidade > 60 ? 'var(--idmt-green)' : '#f59e0b';
        }
    }

    function pedirAjuda() {
        if(!casoAtual || faseAtual === 4) return;
        pontuacao = Math.max(0, pontuacao - 10);
        
        let dica = "";
        if(faseAtual === 1) dica = casoAtual.fase_1_investigacao.resposta_preceptor_erro;
        else if (faseAtual === 2) dica = "Foque na síndrome principal apontada pelos exames.";
        else if (faseAtual === 3) dica = "Lembre-se do tratamento padrão ouro e evite iatrogenias.";
        
        adicionarMensagem("preceptor", `💡 Dica: ${dica}`);
        atualizarDashboard();
    }

    function scientificBoost() {
        if(!casoAtual) return;
        adicionarMensagem("preceptor", `🔬 Buscando diretrizes sobre a patologia alvo no repositório...`);
        setTimeout(() => {
            adicionarMensagem("preceptor", "✅ Diretriz carregada. Foco na prioridade clínica.");
            clinicalLog.scrollTop = clinicalLog.scrollHeight;
        }, 1000);
    }

    function adicionarMensagem(classe, texto) {
        const div = document.createElement('div');
        div.className = 'mensagem ' + classe;
        div.innerText = texto;
        clinicalLog.appendChild(div);
    }
</script>
</body>
</html>
