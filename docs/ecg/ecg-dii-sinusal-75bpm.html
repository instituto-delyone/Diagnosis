<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECG DII · Sinusal · 75 bpm</title>
<style>
:root{
  --bg:#07111f;
  --panel:#0b1724;
  --minor:#173043;
  --major:#29485e;
  --trace:#34d399;
  --text:#e8f0f7;
  --muted:#8fa7ba;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  padding:24px; background:var(--bg); color:var(--text);
  font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.card{
  width:min(1100px,100%);
  background:var(--panel);
  border:1px solid #1d3a52;
  border-radius:16px;
  overflow:hidden;
}
header{
  display:flex; justify-content:space-between; align-items:center;
  gap:20px; padding:18px 20px; border-bottom:1px solid #183247;
}
h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase}
.live{color:var(--trace);font-weight:800;font-size:12px}
.monitor{padding:18px;background:#061019}
svg{
  display:block;width:100%;height:300px;
  background-image:
    linear-gradient(var(--minor) 1px,transparent 1px),
    linear-gradient(90deg,var(--minor) 1px,transparent 1px),
    linear-gradient(var(--major) 1px,transparent 1px),
    linear-gradient(90deg,var(--major) 1px,transparent 1px);
  background-size:20px 20px,20px 20px,100px 100px,100px 100px;
}
path{
  fill:none;stroke:var(--trace);stroke-width:3;
  vector-effect:non-scaling-stroke;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 5px rgba(52,211,153,.55));
}
.measure{
  stroke:#8fa7ba;stroke-width:1.5;stroke-dasharray:5 5;
  opacity:.65;
}
.label{fill:#8fa7ba;font-size:13px;font-family:system-ui,sans-serif}
footer{
  display:flex;justify-content:space-between;gap:12px;
  padding:12px 18px;color:var(--muted);font-size:11px;
}
strong{color:var(--text)}
</style>
</head>
<body>
<main class="card">
<header>
  <h1>Monitor cardiorrespiratório · DII</h1>
  <div class="live">● RITMO SINUSAL · 75 BPM</div>
</header>

<div class="monitor">
<svg viewBox="0 0 1200 300" preserveAspectRatio="none" aria-label="ECG DII sinusal estático a 75 bpm">

  <!-- 3 ciclos: R em x=200, 600 e 1000.
       400 px = 20 quadradinhos = 4 quadrados grandes.
       300 / 4 = 75 bpm. -->

  <path class="measure" d="M200 45 V255 M600 45 V255 M1000 45 V255"/>
  <text class="label" x="385" y="38">20 quadradinhos = 4 quadrados grandes</text>

  <!-- CICLO 1 -->
  <path d="
    M0 150
    L70 150
    C82 150 88 144 94 138
    C100 132 106 138 112 150
    L158 150
    L174 150
    L184 154
    L191 146
    L198 155
    L202 52
    L208 215
    L215 150
    L245 150
    C275 150 292 145 310 139
    C330 133 350 137 370 150
    L400 150
  "/>

  <!-- CICLO 2 -->
  <path d="
    M400 150
    L470 150
    C482 150 488 144 494 138
    C500 132 506 138 512 150
    L558 150
    L574 150
    L584 154
    L591 146
    L598 155
    L602 52
    L608 215
    L615 150
    L645 150
    C675 150 692 145 710 139
    C730 133 750 137 770 150
    L800 150
  "/>

  <!-- CICLO 3 -->
  <path d="
    M800 150
    L870 150
    C882 150 888 144 894 138
    C900 132 906 138 912 150
    L958 150
    L974 150
    L984 154
    L991 146
    L998 155
    L1002 52
    L1008 215
    L1015 150
    L1045 150
    C1075 150 1092 145 1110 139
    C1130 133 1150 137 1170 150
    L1200 150
  "/>
</svg>
</div>

<footer>
  <span>DII · traçado sinusal estático</span>
  <span><strong>25 mm/s</strong> · 1 quadradinho = 40 ms · 20 quadradinhos = 800 ms · <strong>75 bpm</strong></span>
</footer>
</main>
</body>
</html>
