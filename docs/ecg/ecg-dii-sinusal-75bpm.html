<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECG DII · Sinusal · 75 bpm</title>
<style>
:root{
  --bg:#07111f;
  --panel:#0b1724;
  --minor:#173043;
  --major:#29485e;
  --trace:#34d399;
  --text:#e8f0f7;
  --muted:#8fa7ba;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  padding:24px; background:var(--bg); color:var(--text);
  font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.card{
  width:min(1100px,100%);
  background:var(--panel);
  border:1px solid #1d3a52;
  border-radius:16px;
  overflow:hidden;
}
header{
  display:flex; justify-content:space-between; align-items:center;
  gap:20px; padding:18px 20px; border-bottom:1px solid #183247;
}
h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase}
.live{color:var(--trace);font-weight:800;font-size:12px}
.monitor{padding:18px;background:#061019}
svg{
  display:block;width:100%;height:300px;
  background-image:
    linear-gradient(var(--minor) 1px,transparent 1px),
    linear-gradient(90deg,var(--minor) 1px,transparent 1px),
    linear-gradient(var(--major) 1px,transparent 1px),
    linear-gradient(90deg,var(--major) 1px,transparent 1px);
  background-size:20px 20px,20px 20px,100px 100px,100px 100px;
}
.ecg-strip{
  animation: ecgBeat 0.8s linear infinite;
  will-change: transform;
}
.ecg-strip path{
  fill:none;
  stroke:var(--trace);
  stroke-width:3;
  vector-effect:non-scaling-stroke;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 5px rgba(52,211,153,.55));
}
@keyframes ecgBeat{
  from{transform:translateX(0)}
  to{transform:translateX(-400px)}
}
path{
  vector-effect:non-scaling-stroke;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 5px rgba(52,211,153,.55));
}
.measure{
  stroke:#8fa7ba;stroke-width:1.5;stroke-dasharray:5 5;
  opacity:.65;
}
.label{fill:#8fa7ba;font-size:13px;font-family:system-ui,sans-serif}
footer{
  display:flex;justify-content:space-between;gap:12px;
  padding:12px 18px;color:var(--muted);font-size:11px;
}
strong{color:var(--text)}
</style>
</head>
<body>
<main class="card">
<header>
  <h1>Monitor cardiorrespiratório · DII</h1>
  <div class="live">● RITMO SINUSAL · 75 BPM</div>
</header>

<div class="monitor">
<svg viewBox="0 0 1200 300" preserveAspectRatio="none" aria-label="ECG DII sinusal animado a 75 bpm">
  <defs>
    <clipPath id="ecgViewport"><rect x="0" y="0" width="1200" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#ecgViewport)">
    <g class="ecg-strip">
      <!-- Cada ciclo ocupa 400 px. Em 25 mm/s:
           20 quadradinhos = 800 ms.
           1 ciclo / 800 ms = 75 ciclos/min. -->
      <g transform="translate(0,0)">
        <path d="M0 150 L70 150 C82 150 88 144 94 138 C100 132 106 138 112 150 L158 150 L174 150 L184 154 L191 146 L198 155 L202 52 L208 215 L215 150 L245 150 C275 150 292 145 310 139 C330 133 350 137 370 150 L400 150"/>
      </g>
      <g transform="translate(400,0)">
        <path d="M0 150 L70 150 C82 150 88 144 94 138 C100 132 106 138 112 150 L158 150 L174 150 L184 154 L191 146 L198 155 L202 52 L208 215 L215 150 L245 150 C275 150 292 145 310 139 C330 133 350 137 370 150 L400 150"/>
      </g>
      <g transform="translate(800,0)">
        <path d="M0 150 L70 150 C82 150 88 144 94 138 C100 132 106 138 112 150 L158 150 L174 150 L184 154 L191 146 L198 155 L202 52 L208 215 L215 150 L245 150 C275 150 292 145 310 139 C330 133 350 137 370 150 L400 150"/>
      </g>
      <g transform="translate(1200,0)">
        <path d="M0 150 L70 150 C82 150 88 144 94 138 C100 132 106 138 112 150 L158 150 L174 150 L184 154 L191 146 L198 155 L202 52 L208 215 L215 150 L245 150 C275 150 292 145 310 139 C330 133 350 137 370 150 L400 150"/>
      </g>
    </g>

    <g class="measurements">
      <line x1="200" y1="45" x2="200" y2="255"/>
      <line x1="600" y1="45" x2="600" y2="255"/>
      <line x1="1000" y1="45" x2="1000" y2="255"/>
    </g>
  </g>

  <text class="label" x="385" y="38">20 quadradinhos = 4 quadrados grandes</text>
</svg>
</div>

<footer>
  <span>DII · traçado sinusal animado</span>
  <span><strong>25 mm/s</strong> · 1 quadradinho = 40 ms · 20 quadradinhos = 800 ms · <strong>75 QRS/min</strong></span>
</footer>
</main>
</body>
</html>
