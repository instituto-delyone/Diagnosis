<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECG · Primeiro Sinal</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2a;--grid:#24405a;--minor:#142b40;--trace:#34d399;--text:#e8f0f7;--muted:#8fa7ba}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif;padding:28px}
main{max-width:1100px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.eyebrow{color:var(--trace);font-weight:700;letter-spacing:.12em;font-size:11px}.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid #1d3a52;border-radius:16px;padding:18px;box-shadow:0 14px 40px #0004}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}button{background:#102438;color:var(--text);border:1px solid #28516d;border-radius:9px;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--trace)}
.monitor{position:relative;overflow:hidden;border-radius:12px;background:#061019;border:1px solid #183246;padding:14px}
svg{display:block;width:100%;height:330px;background-image:linear-gradient(var(--minor) 1px,transparent 1px),linear-gradient(90deg,var(--minor) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:8px 8px,8px 8px,40px 40px,40px 40px}
path{fill:none;stroke:var(--trace);stroke-width:2.2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px #34d39988)}
.footer{display:flex;justify-content:space-between;margin-top:10px}.badge{color:var(--trace);font-weight:700}
pre{white-space:pre-wrap;color:var(--muted);font-size:12px;margin:14px 0 0}
</style>
</head>
<body>
<main>
  <div class="head">
    <div><div class="eyebrow">DIAGNOSYS · ECG ENGINE</div><h1>Primeiro sinal funcionando</h1><div class="muted">Ritmo sinusal sintético · curva educacional</div></div>
    <div class="badge">LIVE · <span id="rate">72</span> bpm</div>
  </div>
  <div class="card">
    <div class="controls">
      <button id="slower">− FC</button><button id="faster">+ FC</button>
      <span class="muted">Ajuste a frequência e observe o RR mudar.</span>
    </div>
    <div class="monitor">
      <svg id="ecg" viewBox="0 0 1000 330" preserveAspectRatio="none" aria-label="ECG sintético"></svg>
      <div class="footer"><span>ECG SIMULADO · motor de sinal</span><span>FC <b id="rate2">72</b> bpm</span></div>
    </div>
    <pre id="meta"></pre>
  </div>
</main>
<script type="module">
import { generateRepeatedSinus } from "./engine/ecg-signal-generator.js";

let bpm=72;
const svg=document.querySelector("#ecg");
function render(){
  const data=generateRepeatedSinus({heartRate:bpm,cycles:4});
  const maxT=data.points.at(-1).t_ms;
  const points=data.points.map(p=>{
    const x=(p.t_ms/maxT)*1000;
    const y=165-p.amplitude_mV*105;
    return [x,y];
  });
  const d=points.map((p,i)=>(i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" ");
  svg.innerHTML='<path d="'+d+'"></path>';
  document.querySelector("#rate").textContent=bpm;
  document.querySelector("#rate2").textContent=bpm;
  document.querySelector("#meta").textContent=JSON.stringify({
    rhythm:data.rhythm,
    heart_rate_bpm:data.heart_rate_bpm,
    rr_ms:Number(data.rr_ms.toFixed(1)),
    sample_rate_hz:data.sample_rate_hz,
    points:data.points.length
  },null,2);
}
document.querySelector("#slower").onclick=()=>{bpm=Math.max(40,bpm-5);render()};
document.querySelector("#faster").onclick=()=>{bpm=Math.min(180,bpm+5);render()};
render();
</script>
</body>
</html>
