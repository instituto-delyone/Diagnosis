<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnosis Engine - Arena de Testes</title>
  <style>
    /* === VARIÁVEIS DE IDENTIDADE VISUAL === */
    :root {
      --navy: #071426;
      --blue: #1f5fae;
      --light-blue: #e5f2fc;
      --ink: #1f2933;
      --muted: #66757c;
      --bg: #f7f9fc;
      --card: #ffffff;
      --border: #dce5e8;
      --green: #238b57;
      --green-soft: #ecf8f1;
      --red: #cf5148;
      --red-soft: #fdf2f1;
    }

    /* === RESET E BASE === */
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--ink);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* === CONTAINERS === */
    .arena-container, .modules-container {
      max-width: 780px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 12px 36px rgba(7, 20, 38, 0.04);
      transition: all 0.3s ease;
    }

    /* === CABEÇALHO === */
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .header .badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--blue);
      background: var(--light-blue);
      padding: 6px 14px;
      border-radius: 99px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .header h1 { margin: 14px 0 8px; color: var(--navy); font-size: 28px; letter-spacing: -0.02em; }
    .header p { margin: 0; color: var(--muted); font-size: 15px; }

    /* === BOTÕES E INPUTS === */
    .btn {
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      box-shadow: 0 4px 12px rgba(7, 20, 38, 0.1);
    }
    .btn:hover:not(:disabled) { background: var(--blue); transform: translateY(-1px); }
    .btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; box-shadow: none; }
    
    .input-box {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus { border-color: var(--blue); }

    /* === ÁREAS DO SIMULADOR === */
    .case-box {
      background: #fafbfc;
      border-left: 4px solid var(--blue);
      padding: 20px;
      border-radius: 0 10px 10px 0;
      margin-bottom: 24px;
      font-size: 16px;
      line-height: 1.6;
      display: none;
      animation: fadeIn 0.4s ease;
    }
    .interaction-area { display: none; animation: fadeIn 0.4s ease; }
    .question { font-weight: 700; margin-bottom: 12px; color: var(--navy); font-size: 16px; }
    
    .log-area { margin-top: 24px; font-size: 14px; line-height: 1.5; }
    .log-item { margin-bottom: 10px; padding: 14px 16px; border-radius: 8px; animation: slideDown 0.3s ease; }
    .log-correct { background: var(--green-soft); color: var(--green); border: 1px solid #c9ead8; }
    .log-incorrect { background: var(--red-soft); color: var(--red); border: 1px solid #fad3d0; }
    .log-info { background: #f0f4f8; color: var(--blue); border: 1px solid #d9e6f2; }
    
    .score-board {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
      font-size: 26px;
      font-weight: 800;
      color: var(--navy);
      display: none;
      animation: fadeIn 0.5s ease;
    }

    /* === CARD DE MÓDULOS (O MANIFESTO VISUAL) === */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .module-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      background: #fafbfc;
      transition: transform 0.2s;
    }
    .module-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.03); }
    .module-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .module-title { font-weight: 800; color: var(--navy); font-size: 15px; }
    .status-badge { font-size: 10px; font-weight: 800; padding: 5px 10px; border-radius: 6px; }
    .status-badge.active { background: var(--green-soft); color: var(--green); border: 1px solid #c9ead8; }
    .status-badge.empty { background: #f4f7f8; color: var(--muted); border: 1px solid var(--border); }
    .file-list { margin: 0; padding-left: 20px; font-size: 13px; color: var(--muted); }
    .file-list li { margin-bottom: 6px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<!-- SIMULADOR PRINCIPAL (AIGAR ENGINE) -->
<div class="arena-container">
  <div class="header">
    <span class="badge">AIGAR ENGINE - V1.0 DATA FETCH</span>
    <h1>Simulador de Raciocínio</h1>
    <p id="status-engine">Estabelecendo conexão neural com o banco de dados clínico...</p>
  </div>

  <button id="btn-start" class="btn" onclick="iniciarJogo()" disabled>Aguardando Módulos...</button>

  <div id="case-display" class="case-box"></div>

  <div id="interaction" class="interaction-area">
    <div id="step-indicator" style="font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 800; letter-spacing: 0.05em;"></div>
    <div id="question-text" class="question"></div>
    <input type="text" id="user-input" class="input-box" placeholder="Digite sua conduta e pressione Enter..." onkeypress="handleEnter(event)">
    <button class="btn" onclick="processarResposta()" style="background: var(--blue);">Enviar Resposta Clínica</button>
  </div>

  <div id="log" class="log-area"></div>
  <div id="final-score" class="score-board"></div>
</div>

<!-- MANIFESTO VISUAL (STATUS DOS JSONS) -->
<div class="modules-container">
  <h2 style="margin: 0 0 6px; font-size: 20px; color: var(--navy); font-weight: 800;">Módulos de Conhecimento</h2>
  <p style="margin: 0 0 16px; font-size: 14px; color: var(--muted);">Status em tempo real de integração com a knowledge_base do Instituto Delyone.</p>
  
  <div class="module-grid" id="module-grid">
    <!-- Renderizado pelo JavaScript -->
  </div>
</div>

<script>
  /**
   * ==========================================
   * 1. MANIFESTO DO CONHECIMENTO (O GPS)
   * ==========================================
   * Rota ajustada com base no print da árvore de arquivos do GitHub.
   */
  const manifestoConhecimento = {
    "Clínica Médica": {
      pasta: "../knowledge_base/sindromes_clinicas/",
      arquivos: [
        "endocrinologia.json",
        "ictericia.json",
        "sindrome_metabolica_diabetes.json",
        "sindrome_metabolica_has.json"
      ]
    },
    "Ginecologia e Obstetrícia": {
      pasta: "../knowledge_base/go/",
      arquivos: []
    },
    "Pediatria": {
      pasta: "../knowledge_base/pediatria/",
      arquivos: []
    },
    "Cirurgia Geral": {
      pasta: "../knowledge_base/cirurgia/",
      arquivos: []
    }
  };

  // Onde os dados dos JSONs serão armazenados após o download.
  let bancoDeDados = [];

  /**
   * ==========================================
   * 2. MOTOR DE BUSCA (Data Fetcher)
   * ==========================================
   */
  async function carregarConhecimento() {
    renderizarPainelModulos();
    let casosCarregados = 0;

    for (const [materia, dados] of Object.entries(manifestoConhecimento)) {
      for (const arquivo of dados.arquivos) {
        const caminhoCompleto = dados.pasta + arquivo;
        try {
          const response = await fetch(caminhoCompleto);
          if (response.ok) {
            const casoJson = await response.json();
            // Desempacota o array de síndromes do arquivo JSON
            bancoDeDados.push(...casoJson);
            casosCarregados += casoJson.length;
          } else {
            console.warn(`[AIGAR Engine] Arquivo não encontrado ou erro 404: ${caminhoCompleto}`);
          }
        } catch (error) {
          console.error(`[AIGAR Engine] Erro de CORS/Rede ao carregar ${arquivo}:`, error);
        }
      }
    }

    const statusEl = document.getElementById('status-engine');
    const btnStart = document.getElementById('btn-start');

    if (casosCarregados > 0) {
      statusEl.innerHTML = `<span style="color: var(--green); font-weight: 600;">✓ Sistema Operacional. ${casosCarregados} patologias ativas no motor bayesiano.</span>`;
      btnStart.innerText = "Gerar Novo Caso Clínico";
      btnStart.disabled = false;
    } else {
      statusEl.innerHTML = `<span style="color: var(--red); font-weight: 600;">⚠️ Atenção: JSONs não localizados no servidor. Rodando Modo Demonstração.</span>`;
      bancoDeDados.push({
        id: "demo_falha",
        nome: "Demonstração (Erro de Leitura)",
        vigneta: "O sistema não conseguiu ler os arquivos JSON. Verifique a propagação do servidor no GitHub Pages.",
        respostas_esperadas: { diagnostico: ["teste"], exames: ["teste"], conduta: ["teste"] },
        feedback_tecnico: "Modo de demonstração ativado por falha de sincronização."
      });
      btnStart.innerText = "Testar Interface (Demonstração)";
      btnStart.disabled = false;
    }
  }

  function renderizarPainelModulos() {
    const grid = document.getElementById('module-grid');
    grid.innerHTML = '';

    for (const [materia, dados] of Object.entries(manifestoConhecimento)) {
      const temArquivos = dados.arquivos.length > 0;
      const badgeClass = temArquivos ? 'active' : 'empty';
      const badgeText = temArquivos ? `${dados.arquivos.length} ARQUIVO(S)` : 'AGUARDANDO DADOS';
      
      let listaHtml = temArquivos 
        ? `<ul class="file-list">${dados.arquivos.map(arq => `<li>${arq}</li>`).join('')}</ul>`
        : `<span style="font-size: 13px; color: var(--muted);">Sem conexões estabelecidas.</span>`;

      grid.innerHTML += `
        <div class="module-card">
          <div class="module-header">
            <span class="module-title">${materia}</span>
            <span class="status-badge ${badgeClass}">${badgeText}</span>
          </div>
          ${listaHtml}
        </div>
      `;
    }
  }

  /**
   * ==========================================
   * 3. LÓGICA DO SIMULADOR (Game Loop)
   * ==========================================
   */
  let casoAtual = null;
  let etapa = 0; 
  let pontuacao = 0;
  
  const etapasJogo = [
    { label: "PASSO 1: DIAGNÓSTICO", pergunta: "Qual a sua principal hipótese diagnóstica?", chave: "diagnostico", peso: 50 },
    { label: "PASSO 2: INVESTIGAÇÃO", pergunta: "Cite 1 exame fundamental para solicitar neste contexto:", chave: "exames", peso: 20 },
    { label: "PASSO 3: INTERVENÇÃO", pergunta: "Qual a principal conduta, antídoto ou tratamento indicado?", chave: "conduta", peso: 30 }
  ];

  function normalizar(texto) {
    return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  }

  function iniciarJogo() {
    casoAtual = bancoDeDados[Math.floor(Math.random() * bancoDeDados.length)];
    etapa = 0;
    pontuacao = 0;

    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('case-display').style.display = 'block';
    document.getElementById('case-display').innerHTML = `<strong style="color: var(--navy);">Apresentação Clínica:</strong><br>${casoAtual.vigneta}`;
    
    document.getElementById('interaction').style.display = 'block';
    document.getElementById('log').innerHTML = '';
    document.getElementById('final-score').style.display = 'none';
    
    carregarEtapa();
  }

  function carregarEtapa() {
    if (etapa < etapasJogo.length) {
      document.getElementById('step-indicator').innerText = etapasJogo[etapa].label;
      document.getElementById('question-text').innerText = etapasJogo[etapa].pergunta;
      document.getElementById('user-input').value = '';
      document.getElementById('user-input').focus();
    } else {
      finalizarCaso();
    }
  }

  function handleEnter(e) {
    if (e.key === 'Enter') processarResposta();
  }

  function processarResposta() {
    const inputUsuario = normalizar(document.getElementById('user-input').value);
    if (!inputUsuario) return;

    const regraAtual = etapasJogo[etapa];
    const respostasAceitas = casoAtual.respostas_esperadas[regraAtual.chave];
    
    // Motor de verificação simples de palavras-chave
    let acertou = respostasAceitas.some(resp => inputUsuario.includes(normalizar(resp)));

    const logDiv = document.getElementById('log');
    
    if (acertou) {
      pontuacao += regraAtual.peso;
      logDiv.innerHTML += `<div class="log-item log-correct"><strong>✓ Decisão Acurada (+${regraAtual.peso} pts):</strong> O motor de inferência validou a resposta clínica para [${regraAtual.chave}].</div>`;
    } else {
      logDiv.innerHTML += `<div class="log-item log-incorrect"><strong>✕ Divergência Lógica:</strong> A conduta informada não atingiu a probabilidade necessária para [${regraAtual.chave}]. O sistema canônico esperava diretrizes como: <em>${respostasAceitas[0]}</em>.</div>`;
    }

    etapa++;
    carregarEtapa();
  }

  function finalizarCaso() {
    document.getElementById('interaction').style.display = 'none';
    const logDiv = document.getElementById('log');
    const scoreDiv = document.getElementById('final-score');

    logDiv.innerHTML += `<div class="log-item log-info"><strong>📋 Relatório do Algoritmo Bayesiano:</strong><br>${casoAtual.feedback_tecnico}</div>`;
    
    scoreDiv.style.display = 'block';
    scoreDiv.innerHTML = `Performance Clínica: ${pontuacao}/100<br>
      <button class="btn" style="margin-top: 24px; max-width: 250px;" onclick="iniciarJogo()">↻ Simular Novo Caso</button>`;
  }

  // Aciona o motor na inicialização da página
  window.onload = carregarConhecimento;
</script>

</body>
</html>
