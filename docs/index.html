<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnosis Engine - Arena de Testes</title>
  <style>
    :root {
      --navy: #071426;
      --blue: #1f5fae;
      --light-blue: #e5f2fc;
      --ink: #1f2933;
      --muted: #66757c;
      --bg: #f7f9fc;
      --card: #ffffff;
      --border: #dce5e8;
      --green: #238b57;
      --red: #cf5148;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .arena-container, .modules-container {
      max-width: 740px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(7, 20, 38, 0.05);
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .header span {
      font-size: 11px;
      font-weight: 800;
      color: var(--blue);
      background: var(--light-blue);
      padding: 6px 12px;
      border-radius: 99px;
      letter-spacing: 0.05em;
    }
    .header h1 { margin: 10px 0 5px; color: var(--navy); }
    .header p { margin: 0; color: var(--muted); font-size: 14px; }
    
    .btn {
      background: var(--navy);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }
    .btn:hover { background: var(--blue); }
    .btn:disabled { background: var(--muted); cursor: not-allowed; }
    
    .case-box {
      background: #fafafa;
      border-left: 4px solid var(--blue);
      padding: 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 20px;
      font-size: 15px;
      line-height: 1.6;
      display: none;
    }
    
    .interaction-area { display: none; }
    .question { font-weight: 600; margin-bottom: 10px; color: var(--navy); }
    .input-box {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    
    .log-area {
      margin-top: 20px;
      border-top: 1px dashed var(--border);
      padding-top: 20px;
      font-size: 13px;
    }
    .log-item { margin-bottom: 8px; padding: 10px; border-radius: 6px; }
    .log-correct { background: #ecf8f1; color: var(--green); border: 1px solid #c9ead8; }
    .log-incorrect { background: #fdf2f1; color: var(--red); border: 1px solid #fad3d0; }
    .log-info { background: #f0f4f8; color: var(--blue); border: 1px solid #d9e6f2; }
    
    .score-board {
      text-align: center;
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: var(--navy);
      display: none;
    }

    /* Estilos do Card de Módulos */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .module-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: #fafbfc;
    }
    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .module-title {
      font-weight: 700;
      color: var(--navy);
      font-size: 15px;
    }
    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .badge.active { background: #ecf8f1; color: var(--green); border: 1px solid #c9ead8; }
    .badge.empty { background: #f4f7f8; color: var(--muted); border: 1px solid var(--border); }
    .file-list {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      color: var(--muted);
    }
    .file-list li { margin-bottom: 4px; }
  </style>
</head>
<body>

<!-- SIMULADOR PRINCIPAL -->
<div class="arena-container">
  <div class="header">
    <span>AIGAR ENGINE - V0.2 DATA FETCH</span>
    <h1>Simulador de Raciocínio</h1>
    <p id="status-engine">Conectando ao banco de dados clínico...</p>
  </div>

  <button id="btn-start" class="btn" onclick="iniciarJogo()" disabled>Aguardando Módulos...</button>

  <div id="case-display" class="case-box"></div>

  <div id="interaction" class="interaction-area">
    <div id="step-indicator" style="font-size: 11px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; font-weight: bold;"></div>
    <div id="question-text" class="question"></div>
    <input type="text" id="user-input" class="input-box" placeholder="Digite sua resposta e aperte Enter..." onkeypress="handleEnter(event)">
    <button class="btn" onclick="processarResposta()" style="background: var(--blue);">Enviar Resposta</button>
  </div>

  <div id="log" class="log-area"></div>
  <div id="final-score" class="score-board"></div>
</div>

<!-- CARD DE MÓDULOS CARREGADOS -->
<div class="modules-container">
  <h2 style="margin: 0 0 5px; font-size: 18px; color: var(--navy);">Módulos de Conhecimento</h2>
  <p style="margin: 0 0 10px; font-size: 13px; color: var(--muted);">Status de integração com os arquivos JSON da knowledge_base.</p>
  
  <div class="module-grid" id="module-grid">
    <!-- Os cards das matérias serão injetados aqui pelo JavaScript -->
  </div>
</div>

<script>
  // ==========================================
  // MANIFESTO DO CONHECIMENTO (Ponte de Arquivos)
  // ==========================================
  // Aqui você define quais matérias existem e quais arquivos JSON o algoritmo deve procurar.
  const manifestoConhecimento = {
    "Clínica Médica": {
      pasta: "../../knowledge_base/sindromes_clinicas/",
      arquivos: ["ictericia.json"] // Adicione os próximos JSONs aqui
    },
    "Ginecologia e Obstetrícia": {
      pasta: "../../knowledge_base/go/",
      arquivos: []
    },
    "Pediatria": {
      pasta: "../../knowledge_base/pediatria/",
      arquivos: []
    },
    "Cirurgia Geral": {
      pasta: "../../knowledge_base/cirurgia/",
      arquivos: []
    }
  };

  let bancoDeDados = [];

  // ==========================================
  // INICIALIZAÇÃO E FETCH (Engine)
  // ==========================================
  async function carregarConhecimento() {
    renderizarPainelModulos();
    let casosCarregados = 0;

    for (const [materia, dados] of Object.entries(manifestoConhecimento)) {
      for (const arquivo of dados.arquivos) {
        const caminhoCompleto = dados.pasta + arquivo;
        try {
          // Tenta baixar o arquivo JSON do repositório
          const response = await fetch(caminhoCompleto);
          if (response.ok) {
            const casoJson = await response.json();
            // Para o simulador, assumimos que o JSON tem os campos vigneta, respostas e feedback
            // Caso o JSON seja puro (molde estrutural), faremos um parse aqui no futuro.
            bancoDeDados.push(casoJson);
            casosCarregados++;
          } else {
            console.warn(`Arquivo não encontrado ainda: ${caminhoCompleto}`);
          }
        } catch (error) {
          console.error(`Erro ao carregar ${arquivo}:`, error);
        }
      }
    }

    const statusEl = document.getElementById('status-engine');
    const btnStart = document.getElementById('btn-start');

    if (casosCarregados > 0) {
      statusEl.innerHTML = `<span style="color: var(--green);">✓ Motor operacional. ${casosCarregados} caso(s) sincronizado(s).</span>`;
      btnStart.innerText = "Gerar Caso Clínico Aleatório";
      btnStart.disabled = false;
    } else {
      // FALLBACK DE TESTE: Se os arquivos JSON não existirem na pasta ainda, carrega 1 caso padrão na memória
      statusEl.innerHTML = `<span style="color: var(--red);">Nenhum JSON encontrado. Rodando em Modo de Demonstração.</span>`;
      bancoDeDados.push({
        id: "demo_colangite",
        nome: "Colangite Aguda (Demo)",
        vigneta: "Paciente de 65 anos, com histórico prévio de coledocolitíase. Dá entrada no PS apresentando quadro de icterícia colestática associada a febre com calafrios e dor intensa em hipocôndrio direito. PA: 120x80 mmHg, sem confusão mental.",
        respostas_esperadas: {
          diagnostico: ["colangite", "colangite aguda"],
          exames: ["usg", "ultrassom", "hemograma", "bilirrubinas", "tgo", "tgp"],
          conduta: ["antibiotico", "antibioticoterapia", "drenagem", "cpre"]
        },
        feedback_tecnico: "Demonstração: A Colangite Aguda exige identificação rápida da Tríade de Charcot (Icterícia, Febre e Dor)."
      });
      btnStart.innerText = "Testar Caso de Demonstração";
      btnStart.disabled = false;
    }
  }

  function renderizarPainelModulos() {
    const grid = document.getElementById('module-grid');
    grid.innerHTML = '';

    for (const [materia, dados] of Object.entries(manifestoConhecimento)) {
      const temArquivos = dados.arquivos.length > 0;
      const badgeClass = temArquivos ? 'active' : 'empty';
      const badgeText = temArquivos ? `${dados.arquivos.length} CARREGADO(S)` : 'AGUARDANDO';
      
      let listaHtml = temArquivos 
        ? `<ul class="file-list">${dados.arquivos.map(arq => `<li>${arq}</li>`).join('')}</ul>`
        : `<span style="font-size: 12px; color: var(--muted);">Nenhum caso inserido.</span>`;

      grid.innerHTML += `
        <div class="module-card">
          <div class="module-header">
            <span class="module-title">${materia}</span>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          ${listaHtml}
        </div>
      `;
    }
  }

  // ==========================================
  // LÓGICA DO SIMULADOR (Jogo)
  // ==========================================
  let casoAtual = null;
  let etapa = 0; 
  let pontuacao = 0;
  
  const etapasJogo = [
    { label: "PASSO 1: DIAGNÓSTICO", pergunta: "Qual a sua principal hipótese diagnóstica?", chave: "diagnostico", peso: 50 },
    { label: "PASSO 2: INVESTIGAÇÃO", pergunta: "Cite 1 exame fundamental para solicitar agora:", chave: "exames", peso: 20 },
    { label: "PASSO 3: INTERVENÇÃO", pergunta: "Qual a principal conduta ou tratamento indicado?", chave: "conduta", peso: 30 }
  ];

  function normalizar(texto) {
    return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  }

  function iniciarJogo() {
    casoAtual = bancoDeDados[Math.floor(Math.random() * bancoDeDados.length)];
    etapa = 0;
    pontuacao = 0;

    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('case-display').style.display = 'block';
    document.getElementById('case-display').innerHTML = `<strong>Apresentação Clínica:</strong><br>${casoAtual.vigneta}`;
    document.getElementById('interaction').style.display = 'block';
    document.getElementById('log').innerHTML = '';
    document.getElementById('final-score').style.display = 'none';
    
    carregarEtapa();
  }

  function carregarEtapa() {
    if (etapa < etapasJogo.length) {
      document.getElementById('step-indicator').innerText = etapasJogo[etapa].label;
      document.getElementById('question-text').innerText = etapasJogo[etapa].pergunta;
      document.getElementById('user-input').value = '';
      document.getElementById('user-input').focus();
    } else {
      finalizarCaso();
    }
  }

  function handleEnter(e) {
    if (e.key === 'Enter') processarResposta();
  }

  function processarResposta() {
    const inputUsuario = normalizar(document.getElementById('user-input').value);
    if (!inputUsuario) return;

    const regraAtual = etapasJogo[etapa];
    const respostasAceitas = casoAtual.respostas_esperadas[regraAtual.chave];
    
    let acertou = respostasAceitas.some(resp => inputUsuario.includes(normalizar(resp)));

    const logDiv = document.getElementById('log');
    
    if (acertou) {
      pontuacao += regraAtual.peso;
      logDiv.innerHTML += `<div class="log-item log-correct"><strong>✓ Acertou (${regraAtual.peso} pts):</strong> O sistema validou a resposta para a chave [${regraAtual.chave}].</div>`;
    } else {
      logDiv.innerHTML += `<div class="log-item log-incorrect"><strong>✕ Incorreto:</strong> A conduta não atingiu a probabilidade necessária para [${regraAtual.chave}]. O sistema esperava diretrizes como: ${respostasAceitas[0]}.</div>`;
    }

    etapa++;
    carregarEtapa();
  }

  function finalizarCaso() {
    document.getElementById('interaction').style.display = 'none';
    const logDiv = document.getElementById('log');
    const scoreDiv = document.getElementById('final-score');

    logDiv.innerHTML += `<div class="log-item log-info"><strong>📋 Relatório do Motor Bayesiano:</strong><br>${casoAtual.feedback_tecnico}</div>`;
    
    scoreDiv.style.display = 'block';
    scoreDiv.innerHTML = `Performance Clínica: ${pontuacao}/100<br>
      <button class="btn" style="margin-top: 20px; font-size: 13px;" onclick="iniciarJogo()">↻ Gerar Novo Caso</button>`;
  }

  // Aciona o download dos JSONs assim que a página carrega
  window.onload = carregarConhecimento;
</script>

</body>
</html>
