<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Clínico Dinâmico</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #4fc3f7;
            --success: #66bb6a;
            --warning: #ffa726;
            --danger: #ef5350;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .vital-signs {
            font-family: monospace;
            color: var(--accent);
            font-size: 1.1em;
        }

        .clinical-area {
            height: 300px;
            overflow-y: auto;
            background-color: #000;
            padding: 15px;
            border-radius: var(--border-radius);
            font-size: 0.95em;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .clinical-area p { margin: 0; }
        .log-sys { color: #888; font-style: italic; }
        .log-success { color: var(--success); }
        .log-warning { color: var(--warning); }
        .log-danger { color: var(--danger); }
        .log-action { color: var(--accent); font-weight: bold; }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            border-radius: var(--border-radius);
            font-size: 1em;
        }

        input[type="text"]:focus { outline: none; border-color: var(--accent); }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.8; }
        
        .btn-action { background-color: var(--accent); color: #000; }
        .btn-help { background-color: #fbc02d; color: #000; }
        .btn-science { background-color: #9c27b0; color: #fff; }
        .btn-next { background-color: var(--success); color: #000; }
        .btn-back { background-color: #555; color: #fff; }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 id="patient-name" style="margin: 0; font-size: 1.2em;">Carregando...</h2>
        <div class="vital-signs" id="vital-signs">Reserva: 100% | Nota: 100</div>
    </div>

    <!-- Área de Exibição do Caso Clínico -->
    <div class="clinical-area" id="clinical-log"></div>

    <div class="controls">
        <div class="input-row">
            <input type="text" id="user-input" placeholder="Digite sua conduta (ex: o2, eletro, AAS)..." onkeypress="if(event.key === 'Enter') processarAcao()">
            <button class="btn-action" onclick="processarAcao()">Agir</button>
        </div>
        <div class="action-buttons">
            <button class="btn-help" onclick="pedirAjuda()">💡 Dica (-10 pts)</button>
            <button class="btn-science" onclick="scientificBoost()">🔬 PubMed</button>
            <button class="btn-next" onclick="proximoCaso()">Próximo ➡</button>
        </div>
    </div>
</div>

<script>
    // --- 1. O MOLDE (Doenças e Regras Biológicas) ---
    const BancoDeDoencas = {
        IAM_INFERIOR: {
            nome: "IAM de Parede Inferior",
            exigencias: {
                suporte: ["mov", "monitor", "monitorizacao", "oxigenio", "o2", "acesso", "veia"],
                diagnostico: ["ecg", "eletro", "eletrocardiograma", "troponina"],
                tratamento: ["aas", "aspirina", "clopidogrel", "ticagrelor", "heparina", "angioplastia"]
            },
            achados: {
                suporte: "Paciente monitorizado. O2 suplementar instalado. Acesso venoso pérvio.",
                diagnostico: "ECG revela Supra de ST em DII, DIII e aVF. Ritmo sinusal.",
                tratamento: "Dupla antiagregação iniciada. Paciente refere leve melhora da dor."
            },
            danoPorTurno: 15
        }
    };

    // --- 2. A INSTÂNCIA (Os Casos Clínicos Epidemiológicos) ---
    const CasosClinicos = [
        {
            id: 0,
            paciente: "Seu João, 55 anos",
            historia: "Chega ao PS pálido e sudoreico. Relata que comeu uma feijoada pesada e está com uma 'azia terrível' que sobe para a mandíbula.",
            patologiaOculta: BancoDeDoencas.IAM_INFERIOR,
            // Estado isolado da instância
            reservaVital: 100,
            notaFinal: 100,
            estado: {
                suporte: false,
                diagnosticado: false,
                tratado: false,
                finalizado: false
            }
        }
    ];

    // --- 3. O MOTOR DE REGRAS ---
    let casoAtualIndex = 0;
    let casoAtivo = null;

    function iniciarCaso(index) {
        if (index >= CasosClinicos.length) {
            document.getElementById('clinical-log').innerHTML = "<p class='log-success'>🏆 Todos os casos finalizados. Excelente plantão!</p>";
            return;
        }
        
        // Clona o caso para não sujar o banco de dados original (boa prática JS)
        casoAtivo = JSON.parse(JSON.stringify(CasosClinicos[index])); 
        
        document.getElementById('patient-name').innerText = casoAtivo.paciente;
        document.getElementById('clinical-log').innerHTML = `<p>${casoAtivo.historia}</p>`;
        atualizarPlacar();
    }

    function atualizarPlacar() {
        document.getElementById('vital-signs').innerText = `Reserva: ${casoAtivo.reservaVital}% | Nota: ${casoAtivo.notaFinal}`;
    }

    function imprimirNoLog(mensagem, classe = "") {
        const log = document.getElementById('clinical-log');
        log.innerHTML += `<p class="${classe}">${mensagem}</p>`;
        log.scrollTop = log.scrollHeight; // Rola para o fim automaticamente
    }

    function processarAcao() {
        if (casoAtivo.estado.finalizado) return;

        const inputEl = document.getElementById('user-input');
        const inputStr = inputEl.value.toLowerCase().trim();
        inputEl.value = ""; // limpa o campo

        if (!inputStr) return;

        const patologia = casoAtivo.patologiaOculta;
        imprimirNoLog(`> Conduta: ${inputStr}`, "log-action");

        let acaoValida = false;

        // 1. Verificando Suporte Básico (MOV)
        if (!casoAtivo.estado.suporte && patologia.exigencias.suporte.some(t => inputStr.includes(t))) {
            casoAtivo.estado.suporte = true;
            imprimirNoLog(`✅ ${patologia.achados.suporte}`, "log-success");
            acaoValida = true;
        }
        // 2. Verificando Diagnóstico
        else if (!casoAtivo.estado.diagnosticado && patologia.exigencias.diagnostico.some(t => inputStr.includes(t))) {
            casoAtivo.estado.diagnosticado = true;
            imprimirNoLog(`📋 ${patologia.achados.diagnostico}`, "log-success");
            acaoValida = true;
        }
        // 3. Verificando Tratamento
        else if (!casoAtivo.estado.tratado && patologia.exigencias.tratamento.some(t => inputStr.includes(t))) {
            if (!casoAtivo.estado.diagnosticado) {
                // Punição por tratar sem diagnosticar (iatrogenia)
                casoAtivo.notaFinal -= 30;
                imprimirNoLog("⚠️ Você iniciou tratamento sem confirmar o diagnóstico. Risco de iatrogenia!", "log-warning");
            }
            casoAtivo.estado.tratado = true;
            imprimirNoLog(`💊 ${patologia.achados.tratamento}`, "log-success");
            acaoValida = true;
        }

        // Consequências do Turno
        if (!acaoValida) {
            casoAtivo.reservaVital -= patologia.danoPorTurno;
            casoAtivo.notaFinal -= 5; // Perde nota por conduta ineficiente
            imprimirNoLog("Conduta sem efeito significativo. O paciente continua deteriorando...", "log-warning");
        }

        verificarFimDeCaso();
        atualizarPlacar();
    }

    function verificarFimDeCaso() {
        if (casoAtivo.reservaVital <= 0) {
            casoAtivo.estado.finalizado = true;
            casoAtivo.notaFinal = 0;
            imprimirNoLog("💀 O paciente entrou em parada cardiorrespiratória. Tempo esgotado.", "log-danger");
        } 
        else if (casoAtivo.estado.diagnosticado && casoAtivo.estado.tratado) {
            casoAtivo.estado.finalizado = true;
            imprimirNoLog(`🏆 Paciente estabilizado! Nota final do atendimento: ${casoAtivo.notaFinal}/100.`, "log-success");
        }
    }

    function pedirAjuda() {
        if (casoAtivo.estado.finalizado) return;
        casoAtivo.notaFinal -= 10;
        
        let dica = "";
        if (!casoAtivo.estado.suporte) dica = "Pense nos passos iniciais de qualquer sala de emergência (suporte de vida).";
        else if (!casoAtivo.estado.diagnosticado) dica = "Esse sintoma que parece gástrico pode ter origem cardíaca. Que exame tira essa dúvida?";
        else if (!casoAtivo.estado.tratado) dica = "Qual a medicação padrão ouro inicial para isquemia coronariana confirmada?";
        
        imprimirNoLog(`💡 Dica do Residente: ${dica}`, "log-sys");
        atualizarPlacar();
    }

    function scientificBoost() {
        imprimirNoLog("🔬 PubMed: 'Apresentações atípicas de IAM, como dor epigástrica e sintomas autonômicos, são mais comuns em idosos, diabéticos e mulheres.'", "log-sys");
    }

    function proximoCaso() {
        casoAtualIndex++;
        iniciarCaso(casoAtualIndex);
    }

    // Inicia o jogo ao carregar
    window.onload = () => iniciarCaso(casoAtualIndex);

</script>
</body>
</html>
