<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Diagnosis | Entrada</title>
  <style>
    :root { --bg:#07111f; --panel:#0d1b2a; --border:#1d3a52; --text:#e8f0f7; --muted:#8fa7ba; --primary:#38bdf8; }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,rgba(56,189,248,.10),transparent 38%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(460px,calc(100% - 32px));padding:32px;background:rgba(13,27,42,.96);border:1px solid var(--border);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
    .kicker{color:var(--primary);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:8px 0 4px;font-size:34px} .sub{margin:0 0 28px;color:var(--muted);line-height:1.5}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:7px}.field label{font-size:12px;color:var(--muted)}
    input{width:100%;padding:13px 14px;color:var(--text);background:#081522;border:1px solid var(--border);border-radius:10px;outline:none}
    input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(56,189,248,.08)}
    button{width:100%;margin-top:16px;padding:13px;border:1px solid var(--primary);border-radius:10px;background:var(--primary);color:#02131d;font-weight:800;cursor:pointer}
    .note{margin-top:14px;color:var(--muted);font-size:11px;text-align:center}
    @media(max-width:520px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <div class="kicker">IDMT Pró</div>
    <h1>Diagnosis</h1>
    <p class="sub">Identifique-se para iniciar a simulação clínica.</p>
    <form id="loginForm" autocomplete="on">
      <div class="row">
        <div class="field"><label for="firstName">Nome</label><input id="firstName" name="given-name" type="text" autocomplete="given-name" required maxlength="80"></div>
        <div class="field"><label for="lastName">Sobrenome</label><input id="lastName" name="family-name" type="text" autocomplete="family-name" required maxlength="120"></div>
      </div>
      <button type="submit">Entrar no Diagnosis</button>
    </form>
    <div class="note">Sem senha. A identificação é usada apenas para esta experiência no navegador.</div>
  </main>
<script>
(() => {
  const form=document.getElementById("loginForm");
  const first=document.getElementById("firstName");
  const last=document.getElementById("lastName");
  try {
    const saved=JSON.parse(localStorage.getItem("diagnosisUser")||"null");
    if(saved?.firstName) first.value=saved.firstName;
    if(saved?.lastName) last.value=saved.lastName;
  } catch {}
  form.addEventListener("submit", event => {
    event.preventDefault();
    const firstName=first.value.trim().replace(/\s+/g," ");
    const lastName=last.value.trim().replace(/\s+/g," ");
    if(!firstName || !lastName) return;
    const user={firstName,lastName,fullName:firstName+" "+lastName};
    localStorage.setItem("diagnosisUser",JSON.stringify(user));
    sessionStorage.setItem("diagnosisUser",JSON.stringify(user));
    window.location.href="diagnosis.html";
  });
})();
</script>
</body>
</html>
