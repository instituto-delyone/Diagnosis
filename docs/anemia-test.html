<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnosys — Deep Knowledge Test</title>
    <style>
        :root{--bg:#07111f;--panel:#0d1b2a;--panel2:#102438;--border:#1d3a52;--text:#e8f0f7;--muted:#8fa7ba;--primary:#38bdf8;--success:#34d399;--warning:#fbbf24;--danger:#fb7185}
        *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
        .app{width:min(1200px,100%);margin:auto;padding:18px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}.header{padding:18px;border-bottom:1px solid var(--border)}
        .grid{display:grid;grid-template-columns:1.5fr .7fr;gap:14px}.content{padding:20px}.title{font-size:26px;font-weight:800}.muted{color:var(--muted)}
        #caseIntro{padding:16px;background:#081522;border-left:3px solid var(--primary);line-height:1.65;margin:16px 0;min-height:80px}
        .log{height:430px;overflow:auto;padding:14px}.entry{padding:10px;margin-bottom:8px;border-left:3px solid var(--primary);background:#0a1724;border-radius:7px;font-size:14px;line-height:1.5}.entry.user{border-left-color:#94a3b8}
        .input{display:flex;gap:8px;padding:14px;border-top:1px solid var(--border)}input{flex:1;padding:13px;background:#081522;border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:15px}button{padding:11px 14px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer}.primary{background:var(--primary);color:#02131d;font-weight:800}.controls{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}.side{padding:16px}.side h3{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.side ul{list-style:none;padding:0}.side li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff0a}.knowledge{padding:16px;line-height:1.6}.knowledge h3{margin-top:0}
        @media(max-width:800px){.grid{grid-template-columns:1fr}.input{flex-direction:column}}
    </style>
</head>
<body>
<div class="app">
    <section class="panel">
        <div class="header"><strong>DIAGNOSYS · DEEP KNOWLEDGE TEST</strong><div class="muted">Teste controlado da nova camada Degree 7</div></div>
        <div class="content">
            <div class="muted">Ambiente</div><strong id="roomLabel">Carregando...</strong>
            <div class="title" id="caseTitle">Carregando caso...</div>
            <div class="muted" id="difficultyLabel">--</div>
            <div id="caseIntro">Carregando...</div>
        </div>
    </section>

    <div class="grid">
        <section class="panel">
            <div class="header"><strong>Conversa clínica</strong><div class="muted">O diagnóstico permanece oculto.</div></div>
            <div id="clinicalLog" class="log"></div>
            <div class="input"><input id="actionInput" placeholder="Pergunte, examine, solicite um exame ou proponha uma conduta..."><button id="sendBtn" class="primary">Enviar</button></div>
            <div class="controls"><button id="hintBtn">Dica</button><button id="scienceBtn">Base científica</button><button id="nextBtn">Novo caso</button></div>
        </section>

        <aside class="panel side">
            <h3>Estado</h3>
            <ul id="stateList"><li><span>Fase</span><span id="stateStatus">--</span></li><li><span>Estabilidade</span><span id="stabilityText">100%</span></li><li><span>Pontuação</span><span id="score">0</span></li><li><span>Interações</span><span>0</span></li></ul>
            <div class="muted">Sala: <span id="roomLabelMeta">--</span></div>
            <div class="muted">Profundidade: <span id="difficultyLabelMeta">--</span></div>
        </aside>
    </div>
</div>

<script src="Js/core/knowledge_base_loader.js"></script>
<script src="Js/core/clinical-model.js"></script>
<script src="Js/core/possibility-engine.js"></script>
<script src="Js/core/patient-generator.js"></script>
<script src="Js/clinical/clinical-interlocutor.js"></script>
<script src="Js/engine.js"></script>
<script src="Js/core/diagnosis-clinical-enhancements.js"></script>
<script src="Js/core/deep-knowledge-runtime.js"></script>
</body>
</html>
